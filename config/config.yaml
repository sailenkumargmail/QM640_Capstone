# Central configuration for the credit-default capstone pipeline.
# All paths are relative to the project root.

seed: 42

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  metrics_dir: "reports/model_performance"

data:
  uci_credit:
    n_synthetic_rows: 6000
    # Real data: data/external/UCI/default of credit card clients.xls
    # (Yeh & Lien, 2009; UCI ML Repository, 30,000 rows), prepared by
    # scripts/prepare_uci_credit.py into data/raw/uci_credit/.
    target_col: "DEFAULT_PAYMENT_NEXT_MONTH"
    id_col: "ID"
    protected_attributes: ["SEX", "AGE_GROUP"]

split:
  test_size: 0.20
  val_size: 0.10  # taken out of the remaining train portion

models:
  logistic_regression:
    max_iter: 2000
  xgboost:
    n_estimators: 400
    tree_method: "hist"
  catboost:
    n_estimators: 400
  ebm:
    max_bins: 256

tuning:
  n_trials: 25
  cv_folds: 5
  scoring: "roc_auc"
  catboost_n_trials: 20
  ebm_n_trials: 6

fairness:
  favorable_label: 0   # in credit default, DEFAULT_PAYMENT_NEXT_MONTH=0 (repaid) is the "favorable" outcome
  disparate_impact_threshold: 0.80
  mitigation_method: "reweighing"
  mitigation_attribute: "SEX"
